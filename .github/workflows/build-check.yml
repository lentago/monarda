# ============================================================================
# build-check — the site compiles, type-checks, and passes an a11y gate
# ============================================================================
# Runs on every pull request that touches the site. Three gates, cheapest
# first: `astro check` (types), `astro build` (it compiles), and pa11y-ci
# (WCAG 2 AA on every built page; `npm run a11y` takes the page list from the
# build, so a new page is checked without editing anything).
#
# It runs twice, once per rung (SITE_RUNG overrides `rung` in
# campaign.config.ts for that build), so the rung you are on and the one you
# might switch to both stay green.
#
# This is NOT wired as a required status check by default — it is path-filtered
# so it only runs when site files change, and a path-filtered required check
# that never fires would deadlock docs-only PRs (the lesson in docs-check.yml).
# If you make it required, remove the `paths:` filter first.
#
# Third-party actions are pinned to a full commit SHA; the trailing comment
# records the version each SHA maps to.
# ============================================================================

name: build-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "public/**"
      - "content/**"
      - "campaign.config.ts"
      - "astro.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".pa11yci.json"
      - "ci/a11y.mjs"
      - ".github/workflows/build-check.yml"

jobs:
  build:
    name: build (rung ${{ matrix.rung }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rung: ["1", "2"]
    env:
      SITE_RUNG: ${{ matrix.rung }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Accessibility check, every page (WCAG 2 AA)
        run: npm run a11y
