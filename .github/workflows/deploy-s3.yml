# ============================================================================
# Deploy to S3 + CloudFront  —  the paid variant (opt-in)
# ============================================================================
# Builds the Astro site and syncs it to an S3 bucket in YOUR OWN AWS account,
# then (optionally) invalidates a CloudFront distribution. Use this instead of
# deploy-pages.yml when you need a custom domain with a CDN, tighter cache
# control, or AWS-native hosting. GitHub Pages (deploy-pages.yml) is free and
# the recommended default; S3 + CloudFront costs money (typically small, but
# not zero — check current AWS pricing for your traffic).
#
#   ┌─ IMPORTANT ─────────────────────────────────────────────────────────────┐
#   │ There are NO long-lived AWS keys anywhere in this kit. Authentication is │
#   │ short-lived via GitHub OIDC → an IAM role you create in your account.    │
#   │ Do not add AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets.            │
#   └─────────────────────────────────────────────────────────────────────────┘
#
# This workflow is DISABLED by default (manual trigger only) so it never runs
# until you have wired up the placeholders below. To turn it on for pushes,
# uncomment the `push:` trigger.
#
# ── One-time setup in YOUR AWS account ──────────────────────────────────────
#  1. Create an S3 bucket for the site (e.g. static website / OAC origin).
#  2. Create a CloudFront distribution in front of it (optional but recommended
#     for HTTPS + a custom domain).
#  3. Create an IAM OIDC identity provider for token.actions.githubusercontent.com
#     and an IAM role your repo can assume. Scope the role's trust policy to
#     THIS repository and (ideally) the `main` branch. Grant it only:
#       s3:PutObject, s3:DeleteObject, s3:ListBucket on the bucket, and
#       cloudfront:CreateInvalidation on the distribution.
#  4. Fill in the four placeholders in `env:` below. Nothing else is secret.
#
# All third-party actions are pinned to a full commit SHA; the trailing comment
# records the version each SHA maps to.
# ============================================================================

name: Deploy to S3 + CloudFront

on:
  # Manual-only until the placeholders below are filled in. Uncomment `push`
  # (and delete this comment) once your bucket, role, and distribution exist.
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  id-token: write # required for GitHub OIDC — this is what replaces static keys

# ── FILL THESE IN (all four are placeholders, none are secret) ──────────────
env:
  AWS_REGION: us-east-1 # <-- your bucket's region
  AWS_ROLE_ARN: arn:aws:iam::000000000000:role/REPLACE_ME_github-oidc-deploy # <-- IAM role to assume via OIDC
  S3_BUCKET: REPLACE_ME-your-campaign-bucket # <-- destination bucket name
  CLOUDFRONT_DISTRIBUTION_ID: "" # <-- optional; leave "" to skip invalidation

concurrency:
  group: s3-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        # --delete removes stale objects. Long cache for fingerprinted Astro
        # assets; short/no-cache for HTML so content updates are picked up.
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront (optional)
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
