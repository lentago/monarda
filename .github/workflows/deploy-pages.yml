# ============================================================================
# Deploy to GitHub Pages  —  the zero-cost default
# ============================================================================
# Builds the Astro site and publishes it to GitHub Pages in YOUR OWN repo.
# Nothing here runs on Lentago infrastructure and no site is hosted by us —
# this deploys to the GitHub account that owns this repository.
#
# One-time setup:
#   1. Repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions.
#   2. If this is a PROJECT pages site (https://<you>.github.io/<repo>/), set
#      `base: "/<repo>/"` in campaign.config.ts. For a user/org site or a custom
#      domain, `base: "/"`.
#   3. Push to `main`. That's it.
#
# All third-party actions are pinned to a full commit SHA (supply-chain hygiene);
# the trailing comment records the human-readable version each SHA maps to.
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without a new commit.
  workflow_dispatch:

# Least privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        # Injects the correct `base` path for the Pages URL at build time.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
