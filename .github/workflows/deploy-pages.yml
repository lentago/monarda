# ============================================================================
# Deploy to GitHub Pages  —  the zero-cost default
# ============================================================================
# Builds the Astro site and publishes it to GitHub Pages in YOUR OWN repo.
# Nothing here runs on Lentago infrastructure and no site is hosted by us —
# this deploys to the GitHub account that owns this repository.
#
# One-time setup:
#   1. Repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions.
#   2. If this is a PROJECT pages site (https://<you>.github.io/<repo>/), set
#      `base: "/<repo>/"` in campaign.config.ts. For a user/org site or a custom
#      domain, `base: "/"`.
#   3. Push to `main`. That's it.
#
# All third-party actions are pinned to a full commit SHA (supply-chain hygiene);
# the trailing comment records the human-readable version each SHA maps to.
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without a new commit.
  workflow_dispatch:

# Least privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        # Injects the correct `base` path for the Pages URL at build time.
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
