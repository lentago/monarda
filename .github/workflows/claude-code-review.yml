# ============================================================================
# Claude Code — Automated PR Review
# ============================================================================
# Thin wrapper around lentago/shared-workflows/claude-review.yml.
# Pinned to Haiku.
#
# >>> CUSTOMIZE THE review_prompt BELOW FOR THIS REPO. <<<
# Do NOT ship the placeholder. A copy-pasted prompt that describes the wrong
# repo is worse than none — it points the reviewer at the wrong rubric. The
# good fleet examples (betula, drosera,
# reference-checker) each describe their OWN content.
# Also review `paths-ignore`: if markdown is this repo's product, do NOT
# ignore "*.md".
# ============================================================================

name: Claude Code Review

# >>> DISABLED 2026-06-25: automated Claude PR review turned off fleet-wide.
# Trigger changed from `pull_request` to manual `workflow_dispatch` only, so it
# never auto-runs on PRs. The repo-specific review_prompt below is preserved.
# To re-enable, restore the `on: pull_request` trigger (see git history).
on:
  workflow_dispatch:

jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: lentago/shared-workflows/.github/workflows/claude-review.yml@main
    secrets: inherit
    with:
      review_prompt: |
        This repo (monarda) is the Lentago Labs campaign-site kit: a GitHub
        template repo whose files are copied verbatim into a CLIENT's own repo.
        It is a minimal static Astro site (Astro components + one
        `campaign.config.ts`), two deploy workflows (GitHub Pages and S3/
        CloudFront via OIDC), and client-facing docs (INTAKE, DRY-RUN, README).
        Review with these dimensions:

        - **Client-context correctness** — every file is copied into a client
          repo, so flag anything that only makes sense inside Lentago, broken
          references, or leftover placeholders that would ship to a client.
        - **Payments / PCI safety** — the kit must NEVER collect or transmit
          card data; donations must stay a processor-hosted embed or link. Flag
          any code path that renders a card input or handles payment data.
        - **Config-driven design** — new campaign content should flow through
          `campaign.config.ts`, not hard-coded source. Flag settings a client
          would have to edit source files to change.
        - **Accessibility & performance** — semantic HTML, landmarks, skip link,
          visible focus, WCAG 2 AA (pa11y gate), system fonts, no trackers, no
          required client JS. Flag regressions.
        - **Supply-chain / secrets** — third-party GitHub Actions must be
          SHA-pinned with a version comment; there must be NO long-lived AWS
          keys (OIDC only). Flag unpinned actions or static credentials.
        - **Docs accuracy** — INTAKE/DRY-RUN/README must match the actual config
          fields, workflows, and deploy steps.
